    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="css/style.css" rel="stylesheet">

<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary d-none" id="main-nav">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1" id="nav-brand"><i class="bi bi-shop"></i> QUICKIES POS</span>
            <div class="d-flex align-items-center text-white flex-wrap justify-content-end gap-2 mt-2 mt-lg-0">
                <span id="nav-outlet-name" class="badge bg-light text-primary fs-6"></span>
                <span id="nav-clock" class="d-none d-sm-inline"></span>
                <button class="btn btn-sm btn-danger" id="btn-reset-data"><i class="bi bi-trash"></i> Reset
                    Default</button>
                <button class="btn btn-sm btn-outline-light" id="btn-change-outlet">Change Outlet</button>
            </div>
        </div>
    </nav>

    <!-- App Container -->
    <div id="app-container" class="container-fluid mt-4">
        <!-- Dynamic content will be injected here -->
    </div>

    <!-- Password Modal -->
    <div class="modal fade" id="passwordModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Enter Password</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="password" id="admin-password" class="form-control" placeholder="Password">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary w-100" id="btn-submit-password">Access Report</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Expense Modal -->
    <div class="modal fade" id="expenseModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title"><i class="bi bi-wallet2"></i> Add Daily Expense</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="expense-form">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Amount (₹)</label>
                            <input type="number" id="expense-amount" class="form-control form-control-lg" required min="1">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Description</label>
                            <input type="text" id="expense-desc" class="form-control" placeholder="e.g. Vegetables, Milk, etc." required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger px-4 fw-bold" id="btn-save-expense">Save Expense</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Print Section (Hidden by default, visible during printing) -->
    <div id="print-section"></div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- App Scripts -->
    <script src="js/models/PosModel.js"></script>
    <script src="js/views/PosView.js"></script>
    <script src="js/controllers/PosController.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
