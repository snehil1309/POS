<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quickies - Online Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-primary sticky-top shadow-sm">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1 fw-bold">
                <i class="bi bi-shop"></i> Quickies
            </span>
            <button class="btn btn-warning position-relative" type="button" id="cart-btn" data-bs-toggle="offcanvas" data-bs-target="#cartOffcanvas">
                <i class="bi bi-cart3"></i> Cart
                <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cart-count">
                    0
                </span>
            </button>
        </div>
    </nav>

    <!-- Header Section -->
    <div class="hero-section text-center py-5 px-3">
        <h1 class="display-4 fw-bold text-white mb-3">Delicious Food, Delivered Quick!</h1>
        <p class="lead text-white-50 mb-4">Order online and enjoy the best Quickies experience.</p>
        
        <div class="container" style="max-width: 600px;">
            <div class="input-group input-group-lg shadow-sm rounded-pill overflow-hidden">
                <span class="input-group-text bg-white border-0"><i class="bi bi-search text-muted"></i></span>
                <input type="text" id="search-input" class="form-control border-0" placeholder="Search for dishes, categories...">
            </div>
        </div>
    </div>

    <!-- Main Content: Menu -->
    <div class="container my-5">
        
        <!-- Category Filter -->
        <div class="category-filters d-flex gap-2 overflow-auto pb-3 mb-4" id="category-filters">
            <!-- Categories will be dynamically injected here -->
        </div>

        <!-- Menu Grid -->
        <div class="row g-4" id="menu-grid">
            <!-- Menu items will be injected here -->
        </div>
    </div>

    <!-- Cart Offcanvas -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="cartOffcanvas" aria-labelledby="cartOffcanvasLabel">
        <div class="offcanvas-header bg-primary text-white">
            <h5 class="offcanvas-title fw-bold" id="cartOffcanvasLabel"><i class="bi bi-cart-check"></i> Your Order</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column p-0">
            
            <div class="p-3 bg-light border-bottom">
                <label class="form-label fw-bold">Your Details (Required for Order)</label>
                <input type="text" id="customer-name" class="form-control mb-2" placeholder="Full Name" required>
                <input type="tel" id="customer-phone" class="form-control" placeholder="Phone Number" required>
            </div>

            <div class="flex-grow-1 overflow-auto p-3" id="cart-items-container">
                <!-- Cart items will be injected here -->
                <div class="text-center text-muted mt-5" id="empty-cart-msg">
                    <i class="bi bi-cart-x display-1"></i>
                    <p class="mt-3 fs-5">Your cart is empty.</p>
                </div>
            </div>
            
            <div class="cart-footer p-3 bg-white border-top shadow-lg">
                <div class="d-flex justify-content-between mb-3 fs-5 fw-bold">
                    <span>Total Amount:</span>
                    <span class="text-success" id="cart-total-price">₹0</span>
                </div>
                <button class="btn btn-primary btn-lg w-100 fw-bold shadow-sm rounded-pill" id="btn-checkout" disabled>
                    Proceed to Checkout <i class="bi bi-arrow-right-circle ms-1"></i>
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
